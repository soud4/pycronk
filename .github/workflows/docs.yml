name: Docs

on:
  push:
    branches: [main]
    paths: ["sites/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Empaquetar sites/
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites

      - id: deploy
        uses: actions/deploy-pages@v4
