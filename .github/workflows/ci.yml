name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs calcula la versión a partir de los tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerías del sistema para Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos
        run: pyright

      - name: Tests unitarios
        run: pytest --cov=pycronk --cov-report=term

      - name: Umbrales de cobertura (spec 008)
        run: |
          coverage report --include="*/pycronk/core/*" --fail-under=95
          coverage report --include="*/pycronk/services/*,*/pycronk/persistence/*" --fail-under=90
