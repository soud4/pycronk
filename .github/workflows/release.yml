name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: python -m pip install -e ".[dev,build]"

      - name: Tests unitarios
        run: pytest

      - name: Versión desde el tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: PyInstaller
        run: pyinstaller packaging/pycronk.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          # La imagen del runner suele traer Inno Setup; si no, se instala.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ZIP portable
        shell: pwsh
        run: Compress-Archive -Path dist\pycronk -DestinationPath "dist\pycronk-$env:VERSION-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-linux:
    # Un AppImage solo funciona en distros con glibc igual o más nueva que la de la máquina donde
    # se compila: 22.04 amplía la compatibilidad.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerías del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Instalar
        run: python -m pip install -e ".[dev,build]"

      - name: Tests unitarios
        run: pytest

      - name: PyInstaller
        run: pyinstaller packaging/pycronk.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: AppImage
        run: packaging/linux/build-appimage.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el Release
      id-token: write # identidad OIDC para firmar con Sigstore
      attestations: write # guardar las atestaciones
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Atestación de procedencia (firma GitHub/Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # v1.0.0-rc1, v1.0.0-beta... se publican como pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
