[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pycronk"
dynamic = ["version"]
description = "Cifrado clásico híbrido (GF(2) + LCG + Fisher-Yates) con interfaz de escritorio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
build = ["pyinstaller>=6.10"]

[project.scripts]
pycronk-cli = "pycronk.cli:main"

[project.gui-scripts]
pycronk = "pycronk.ui.app:main"

[tool.hatch.version]
source = "vcs"
# Sin tag (clon recién hecho o sin git) la build no debe fallar.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pycronk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycronk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/pycronk/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# N802: Qt impone camelCase en overrides (paintEvent, sizeHint...).
# N818: las excepciones se nombran por el problema de dominio (InvalidFormat, Cancelled).
# RUF001-003: los textos en español usan caracteres como «—» o «·» a propósito.
ignore = ["N802", "N818", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/pycronk/core", "src/pycronk/services", "src/pycronk/persistence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
qt_api = "pyside6"

[tool.coverage.run]
source = ["pycronk"]
omit = ["src/pycronk/_version.py"]
